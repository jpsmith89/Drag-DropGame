<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6ec1f5">
  <meta name="description" content="A simple, free drag and drop matching game for toddlers and preschoolers.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Drag &amp; Drop">
  <title>Drag &amp; Drop Fun</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/Fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HOME SCREEN -->
  <main id="home" class="screen active">
    <h1 class="title" aria-label="Drag &amp; Drop">
      <span style="--c:#ff6b6b">D</span><span style="--c:#ff9f1c">r</span><span style="--c:#f7c600">a</span><span style="--c:#4cc86f">g</span>
      <span class="amp" style="--c:#2b3a55">&amp;</span>
      <span style="--c:#2ba6e8">D</span><span style="--c:#7b6cf6">r</span><span style="--c:#e85fb5">o</span><span style="--c:#ff6b6b">p</span>
    </h1>
    <p class="subtitle">Pick a game!</p>
    <div id="themes" class="themes"></div>

    <div class="level" aria-label="How many pieces">
      <span class="level-label">Pieces</span>
      <button class="level-btn" data-n="3">3</button>
      <button class="level-btn" data-n="4">4</button>
      <button class="level-btn" data-n="5">5</button>
    </div>
  </main>

  <!-- GAME SCREEN -->
  <section id="game" class="screen">
    <header class="bar">
      <button id="btn-home" class="round-btn" aria-label="Home">🏠</button>
      <div id="dots" class="dots" aria-hidden="true"></div>
      <button id="btn-sound" class="round-btn" aria-label="Sound on/off">🔊</button>
    </header>

    <div id="targets" class="targets"></div>
    <div id="tray" class="tray"></div>

    <!-- Shown when a round is finished -->
    <div id="win" class="win" hidden>
      <div class="win-card">
        <div class="win-emoji">🎉</div>
        <h2>Well done!</h2>
        <div class="win-buttons">
          <button id="btn-again" class="big-btn" aria-label="Play again">▶️</button>
          <button id="btn-win-home" class="big-btn" aria-label="Home">🏠</button>
        </div>
      </div>
    </div>
  </section>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <script src="game.js"></script>
</body>
</html>
